name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # Use the version declared in package.json if present.
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          fi

          if [[ -z "$changed_files" ]]; then
            echo "No changed-file list found; running the full validation suite."
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app_changed=false
          docs_changed=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == *.md ]]; then
              docs_changed=true
            else
              app_changed=true
            fi
          done <<< "$changed_files"

          echo "app_changed=$app_changed" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "Application checks: $app_changed; documentation checks: $docs_changed"

      - name: Check Markdown formatting and local links
        if: steps.scope.outputs.docs_changed == 'true'
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_HEAD_SHA: ${{ github.sha }}
        run: pnpm check:docs

      - name: Lint
        if: steps.scope.outputs.app_changed == 'true'
        run: pnpm lint

      - name: Test
        if: steps.scope.outputs.app_changed == 'true'
        run: pnpm test

      - name: Build
        if: steps.scope.outputs.app_changed == 'true'
        run: pnpm build
